<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript 练习网页</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>JavaScript 练习网页</h1>
      <p>知识库 + 题库 + 实战编辑器（100题）</p>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="knowledge">知识库</button>
      <button class="tab-btn" data-tab="question-bank">题库</button>
    </nav>

    <main>
      <section id="knowledge" class="tab-panel active">
        <div class="section-title">
          <h2>JavaScript 知识库</h2>
          <p>覆盖常规/进阶主题，每条都可直接运行示例。</p>
        </div>
        <div id="knowledge-list" class="cards"></div>
      </section>

      <section id="question-bank" class="tab-panel">
        <div class="section-title">
          <h2>题库</h2>
          <p id="question-stats"></p>
        </div>

        <div class="question-sections">
          <section>
            <h3>一、选择题（40题）</h3>
            <div id="choice-list" class="cards"></div>
          </section>
          <section>
            <h3>二、填空题（30题）</h3>
            <div id="fill-list" class="cards"></div>
          </section>
          <section>
            <h3>三、实战题（30题）</h3>
            <div id="practice-list" class="cards"></div>
          </section>
        </div>
      </section>
    </main>

    <footer>
      <h3>参考资料（权威）</h3>
      <ul>
        <li>MDN Web Docs（JavaScript）</li>
        <li>ECMAScript Language Specification（TC39）</li>
        <li>javascript.info</li>
        <li>W3C / WHATWG HTML 标准文档</li>
      </ul>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
